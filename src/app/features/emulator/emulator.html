<section class="emulator-test">
    <div class="emulator-controls">
        <button type="button" (click)="toggleGame()">
            {{ isRunning() ? '⏸ Pause' : '▶ Démarrer' }}
        </button>

        <button type="button" (click)="cycleSpeed()">
            Vitesse x{{ speed() }}
        </button>

        <button type="button" (click)="resetGame()">
            ↻ Reset ROM
        </button>
    </div>

    <div class="keyboard-hints">
        <span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> Déplacement</span>
        <span><kbd>M</kbd> A</span>
        <span><kbd>L</kbd> B</span>
        <span><kbd>A</kbd> L</span>
        <span><kbd>E</kbd> R</span>
        <span><kbd>Entrée</kbd> Start</span>
        <span><kbd>Suppr</kbd> Select</span>
    </div>

    <canvas #gameCanvas aria-label="Écran du jeu Pokémon Émeraude"></canvas>

    <p>{{ diagnosticMessage() }}</p>
</section>
