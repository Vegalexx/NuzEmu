<section class="emulator">
    <div class="emulator__screen-frame">
        <div class="emulator__screen">
            <canvas class="emulator__canvas" width="240" height="160"
                aria-label="Écran du jeu Game Boy Advance"></canvas>

            <div class="emulator__placeholder">
                <div class="emulator__chip">GBA</div>

                <div class="emulator__logo">N</div>

                <h2>Prêt à jouer ?</h2>

                <p>
                    Le moteur d’émulation sera chargé ici.
                    Ton jeu s’affichera dans cette zone.
                </p>

                <span class="emulator__resolution">240 × 160 PIXELS</span>
            </div>
        </div>
    </div>

    <div class="emulator__hint">
        <span>ÉCRAN DE JEU</span>
        <span>Rendu pixel-perfect</span>
    </div>
</section>
